<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Transferra</title>

    <link rel="icon" type="image/png" href="/favicon.png">

    <link rel="stylesheet"
        href="/style.css">

</head>

<body>

    <!-- PARTICLES -->

    <div class="particles"></div>

    <!-- LOGO -->

    <div class="topLogo">

        <img src="/img/logo.png" alt="">

    </div>

    <!-- MAIN CONTAINER -->

    <section class="upload-container">

        <!-- DROP ZONE -->

        <form action="">

            <div class="drop-zone">

                <div class="icon-container">

                    <svg viewBox="0 0 24 24" width="160" height="160" stroke="#00d9ff" stroke-width="1.5" fill="#0b1120" stroke-linecap="round" stroke-linejoin="round" class="left">
                      <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                      <polyline points="13 2 13 9 20 9"></polyline>
                    </svg>
                    
                    <svg viewBox="0 0 24 24" width="160" height="160" stroke="#00d9ff" stroke-width="1.5" fill="#0b1120" stroke-linecap="round" stroke-linejoin="round" class="center">
                      <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                      <polyline points="13 2 13 9 20 9"></polyline>
                      <path d="M15.5 17H8.5a2.5 2.5 0 0 1-.2-4.99 3.5 3.5 0 0 1 6.6-1.07 2.5 2.5 0 0 1 .6 6.06Z"></path>
                    </svg>
                    
                    <svg viewBox="0 0 24 24" width="160" height="160" stroke="#00d9ff" stroke-width="1.5" fill="#0b1120" stroke-linecap="round" stroke-linejoin="round" class="right">
                      <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                      <polyline points="13 2 13 9 20 9"></polyline>
                    </svg>

                </div>

                <input type="file"
                    id="fileInput">

                <div class="title">

                    Drop your files here or
                    <span id="browseBtn">

                        browse

                    </span>

                </div>

            </div>

        </form>

        <!-- PROGRESS -->

        <div class="progress-container">

            <div class="bg-progress"></div>

            <div class="inner-container">

                <div class="status">

                    Uploading...

                </div>

                <div class="percent-container">

                    <span class="percentage"
                        id="progressPercent">

                        0

                    </span>%

                </div>

                <div class="progress-bar"></div>

            </div>

        </div>

        <!-- SHARE SECTION -->

        <div class="sharing-container">

            <p class="expire">

                Link expires in 24 hrs

            </p>

            <!-- LINK -->

            <div class="input-container">

                <input type="text"
                    id="fileURL"
                    readonly>

                <img src="/img/copy-icon.svg"
                    id="copyURLBtn">

            </div>

            <!-- QR -->

            <div class="qr-container">

                <img id="qrCode"
                    src=""
                    alt="QR Code">

            </div>

            <!-- BUTTONS -->

            <div class="action-buttons">

                <a id="downloadBtn"
                    class="download-btn">

                    Download QR

                </a>

                <button id="shareBtn">

                    Share

                </button>

            </div>

            <!-- EMAIL -->

            <div class="email-section">

                <p class="email-title">

                    Send via Email

                </p>

                <form id="emailForm">

                    <div class="field">

                        <input type="email"
                            required
                            placeholder="Your Email"
                            name="from-email"
                            id="fromEmail">

                    </div>

                    <div class="field">

                        <input type="email"
                            required
                            placeholder="Receiver Email"
                            name="to-email"
                            id="toEmail">

                    </div>

                    <button type="submit"
                        class="send-btn">

                        Send File

                    </button>

                </form>

            </div>

        </div>

    </section>

    <div class="toast">
        File Uploaded Successfully ⚡
    </div>

    <script src="app.js"></script>

</body>

</html>
