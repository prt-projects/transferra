<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Transferra</title>

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- PARTICLES -->

    <div class="particles"></div>

    <!-- LOGO -->

    <div class="topLogo">

        <img src="/public/img/logo.png" alt="">

    </div>

    <!-- MAIN CONTAINER -->

    <section class="upload-container">

        <!-- DROP ZONE -->

        <form action="">

            <div class="drop-zone">

                <div class="icon-container">

                    <img src="/public/img/cssfile.png"
                        draggable="false"
                        class="center">

                    <img src="/public/img/pngfile.png"
                        draggable="false"
                        class="left">

                    <img src="/public/img/jpgfile.png"
                        draggable="false"
                        class="right">

                </div>

                <input type="file"
                    id="fileInput">

                <div class="title">

                    Drop your files here or
                    <span id="browseBtn">

                        browse

                    </span>

                </div>

            </div>

        </form>

        <!-- PROGRESS -->

        <div class="progress-container">

            <div class="bg-progress"></div>

            <div class="inner-container">

                <div class="status">

                    Uploading...

                </div>

                <div class="percent-container">

                    <span class="percentage"
                        id="progressPercent">

                        0

                    </span>%

                </div>

                <div class="progress-bar"></div>

            </div>

        </div>

        <!-- SHARE SECTION -->

        <div class="sharing-container">

            <p class="expire">

                Link expires in 24 hrs

            </p>

            <!-- LINK -->

            <div class="input-container">

                <input type="text"
                    id="fileURL"
                    readonly>

                <img src="/public/img/copy-icon.svg"
                    id="copyURLBtn">

            </div>

            <!-- QR -->

            <div class="qr-container">

                <img id="qrCode"
                    src=""
                    alt="QR Code">

            </div>

            <!-- BUTTONS -->

            <div class="action-buttons">

                <a id="downloadBtn"
                    class="download-btn"
                    target="_blank">

                    Download

                </a>

                <button id="shareBtn">

                    Share

                </button>

            </div>

            <!-- EMAIL -->

            <div class="email-section">

                <p class="email-title">

                    Send via Email

                </p>

                <form id="emailForm">

                    <div class="field">

                        <input type="email"
                            required
                            placeholder="Your Email"
                            name="from-email"
                            id="fromEmail">

                    </div>

                    <div class="field">

                        <input type="email"
                            required
                            placeholder="Receiver Email"
                            name="to-email"
                            id="toEmail">

                    </div>

                    <button type="submit"
                        class="send-btn">

                        Send File

                    </button>

                </form>

            </div>

        </div>

    </section>

    <div class="toast">
        File Uploaded Successfully ⚡
    </div>

    <script src="app.js"></script>

</body>

</html>
