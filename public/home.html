<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Transferra</title>

    <link rel="stylesheet"
        href="/public/intro.css">

</head>

<body>

    <!-- BACKGROUND IMAGE -->

    <div class="bg-image"></div>

    <!-- PARTICLES -->

    <div class="particles"></div>

    <!-- LOGO -->

    <div class="topLogo">

        <img src="/public/img/logo.png" alt="">

    </div>

    <!-- VIDEO INTRO -->

    <section id="intro">

        <video id="introVideo"
            autoplay
            muted
            playsinline>

            <source src="/public/img/video.mp4"

        </video>

        <div class="overlay"></div>

    </section>

    <!-- WELCOME SCREEN -->

    <section id="welcomePage">

        <div class="welcomeContent">

            <h1>

                Welcome to
                <span>Transferra</span>

            </h1>

            <p>

                Fast • Secure • Futuristic
                File Sharing

            </p>

            <a href="/public/index.html"
                id="exploreBtn">

                Explore Now

            </a>

        </div>

    </section>

    <script src="/public/intro.js"></script>

</body>

</html>
